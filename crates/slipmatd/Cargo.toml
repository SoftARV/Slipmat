[package]
name = "slipmatd"
description = "The Slipmat daemon: owns the sidecar, serves clients over a socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Volume lives on the audio server's stream, not inside MusicKit — see mixer.rs.
libpulse-binding = { version = "2", default-features = false }
slipmat-core = { path = "../slipmat-core" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
