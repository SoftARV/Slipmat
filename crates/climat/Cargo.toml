[package]
name = "climat"
description = "Winamp 2.x for Apple Music, in a terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slipmat-core = { path = "../slipmat-core" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The screen. `crossterm` is ratatui's backend and its event source; taking it
# through ratatui would hide the version they have to agree on.
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

# **PulseAudio, not PipeWire.** PipeWire ships `pipewire-pulse` and this machine
# reports `PulseAudio (on PipeWire 1.6.8)`, so one backend covers both servers
# and every distro that runs either. Reading a sink's *monitor* source is how a
# visualiser watches audio it does not own.
libpulse-binding = { version = "2", default-features = false }
rustfft = "6"
# For `poll` on stdin: asking the terminal its colour must not hang a client
# whose terminal never answers.
libc = "0.2"
