[workspace]
resolver = "3"
members = ["crates/slipmat-core", "crates/slipmatd", "crates/slipmat"]

# Shared so the two crates cannot drift apart on a version.
[workspace.package]
version = "0.11.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `net` and `sync` are the daemon's: a Unix socket, and a broadcast channel to
# fan events out to every connected client.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "net",
    "sync",
    "macros",
    "time",
] }
tracing = "0.1"
